<div class="center">
  <div class="card hero">
    <section class="w3-container w3-center w3-content" style="max-width:3000px">
      <div class="avatar">
        <img src="assets/calebFina.jpg" alt="Pranav Dharmaraj Mundhe">
      </div>
      <h2 class="name">Pranav Dharmaraj Mundhe</h2>

      <div class="summary" *ngIf="sentences.length > 0">
        <p class="line" *ngFor="let parts of sentences; let i = index" [style.animation-delay.ms]="500 + i * 450">
          <span *ngFor="let part of parts" [class.hl]="part.hl"
                [style.animation-delay.ms]="part.hl ? 900 + i * 450 : null">{{ part.text }}</span>
        </p>
      </div>
      <p class="w3-justify" *ngIf="error">Could not load the summary from the backend.</p>

      <mat-divider></mat-divider>
      <section>
        <div class="example-button-row">
          <button mat-raised-button (click)="routeToAsk();">Ask Pranav (AI Agent)</button>
          <button mat-raised-button (click)="routeToContactMe();">Get In Touch</button>
        </div>
        <mat-icon class="pos">code</mat-icon>
      </section>
    </section>
  </div>
</div>
