
<div class="center">
  <h2 class="page-title">Skills</h2>
  <p *ngIf="error" class="error-line">Could not load skills from the backend.</p>

  <div class="grid">
    <div class="skill-card fade-in-up" *ngFor="let skill of skills; let i = index" [style.animation-delay.ms]="i * 100">
      <mat-icon class="cat-icon">{{ iconFor(skill.type) }}</mat-icon>
      <h3 class="category">{{ skill.type }}</h3>
      <ul class="chips">
        <li *ngFor="let chip of chipsOf(skill.name); let ci = index" class="fade-in-up"
            [style.animation-delay.ms]="i * 100 + 150 + ci * 60">{{ chip }}</li>
      </ul>
    </div>
  </div>
</div>
