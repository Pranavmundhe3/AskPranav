
<div class="center">
  <div class="card">
    <section class="w3-container w3-center w3-content" style="max-width:3000px">
      <mat-icon class="pos">shopping_bag</mat-icon>
      <p>Following Are My Skills</p>
      <p *ngIf="error">Could not load skills from the backend.</p>

      <div *ngFor="let skill of skills">
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title class="category">
              {{ skill.type }}
            </mat-panel-title>
          </mat-expansion-panel-header>
          <p class="pos">{{ skill.name }}</p>
        </mat-expansion-panel>
        <br>
      </div>

    </section>
  </div>
</div>
