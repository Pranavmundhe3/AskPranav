<p class="center" *ngIf="error">Could not load data from the backend.</p>

<div class="center fade-in-up" *ngFor="let exp of expDetails; let i = index" [style.animation-delay.ms]="i * 150">
    <div class="card">
      <section class="w3-container w3-center w3-content" style="max-width:3000px">
        <mat-icon class="pos">work</mat-icon>
        <h2 class="pos">Work Profile</h2>
        <h3 class="pos position">{{exp.position}}</h3>
        <p class="pos company-line">
          <img *ngIf="logoFor(exp.company)" [src]="logoFor(exp.company)" class="company-logo"
               [alt]="exp.company + ' logo'">
          <span>{{exp.company}}<span *ngIf="exp.client"> - {{exp.client}}</span><span *ngIf="exp.location"> · {{exp.location}}</span></span>
        </p>
        <p class="pos">{{exp.year}}</p>
        <ul class="bullets">
          <li *ngFor="let point of bulletsOf(exp.description); let bi = index" class="fade-in-up"
              [style.animation-delay.ms]="i * 150 + 250 + bi * 130">{{ point }}</li>
        </ul>
      </section>
    </div>
</div>

<div class="center" *ngIf="certDetails.length > 0">
  <div class="card">
    <section class="w3-container w3-center w3-content" style="max-width:3000px">
      <mat-icon class="pos">analytics</mat-icon>
      <h2 class="pos">Certifications</h2>
      <div class="cert-grid">
        <div class="cert-badge fade-in-up" *ngFor="let item of certDetails; let i = index"
             [style.animation-delay.ms]="i * 120">
          <mat-icon class="cert-icon">military_tech</mat-icon>
          <p class="cert-name">{{item.name}}</p>
          <p class="cert-date" *ngIf="item.completedOn">{{item.completedOn}}</p>
        </div>
      </div>
    </section>
  </div>
</div>
