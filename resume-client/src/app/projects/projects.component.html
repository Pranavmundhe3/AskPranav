<p class="center" *ngIf="error">Could not load projects from the backend.</p>

<div class="center fade-in-up" *ngFor="let project of projects; let i = index" [style.animation-delay.ms]="i * 150">
  <div class="card">
    <section class="w3-container w3-center w3-content" style="max-width:3000px">
      <mat-icon class="pos">build</mat-icon>
      <h2 class="pos fade-in-up" [style.animation-delay.ms]="i * 150 + 80">{{ project.name }}</h2>
      <h4 class="pos fade-in-up" *ngIf="project.duration" [style.animation-delay.ms]="i * 150 + 140">{{ project.duration }}</h4>
      <app-animated-text [text]="project.shortDescription" [keywords]="techsOf(project.techStack)"
                         [baseDelayMs]="i * 150 + 200"></app-animated-text>
      <ul class="tech-chips" *ngIf="project.techStack">
        <li *ngFor="let tech of techsOf(project.techStack); let ti = index" class="fade-in-up"
            [style.animation-delay.ms]="i * 150 + 300 + ti * 80">{{ tech }}</li>
      </ul>
      <p class="pos fade-in-up" *ngIf="project.githubUrl || project.liveUrl"
         [style.animation-delay.ms]="i * 150 + 400 + techsOf(project.techStack).length * 80">
        <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener">GitHub</a>
        <span *ngIf="project.githubUrl && project.liveUrl"> | </span>
        <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener">Live</a>
      </p>
    </section>
  </div>
</div>
