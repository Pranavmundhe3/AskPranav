<p class="center" *ngIf="error">Could not load education from the backend.</p>

<div class="center fade-in-up" *ngFor="let edu of eduDetails; let i = index" [style.animation-delay.ms]="i * 150">
    <div class="card">
      <section class="w3-container w3-center w3-content" style="max-width:3000px">

        <mat-icon class="pos">school</mat-icon>

        <h2 class="pos">{{edu.degree}}</h2>
        <h3 class="pos" *ngIf="edu.grades">{{edu.grades}}</h3>
        <p class="pos">{{edu.university}}</p>
        <p class="pos">{{edu.yearOfCompletion}}</p>
      </section>
    </div>
</div>
