<app-education></app-education>
<p class="center" *ngIf="error">Could not load personal details from the backend.</p>

<ng-container *ngIf="personalDetails">
  <div class="center fade-in-up" *ngIf="hobbies.length > 0" style="animation-delay: 150ms">
    <div class="card">
      <section class="w3-container w3-center w3-content" style="max-width:3000px">
        <mat-icon class="pos">redeem</mat-icon>
       <h2 class="pos">Hobbies &amp; Interests</h2>
       <ul class="chips">
         <li *ngFor="let hobby of hobbies; let i = index" class="fade-in-up" [style.animation-delay.ms]="150 + i * 100">{{ hobby }}</li>
       </ul>
      </section>
    </div>
  </div>
  <div class="center fade-in-up" *ngIf="personalDetails.languages" style="animation-delay: 300ms">
    <div class="card">
      <section class="w3-container w3-center w3-content" style="max-width:3000px">
        <mat-icon class="pos">account_circle</mat-icon>
       <h2 class="pos">Languages Known</h2>
       <p class="pos">{{personalDetails.languages}}</p>
      </section>
    </div>
  </div>
  <div class="center fade-in-up" *ngIf="personalDetails.linkedinUrl || personalDetails.githubUrl || personalDetails.portfolioUrl" style="animation-delay: 450ms">
    <div class="card">
      <section class="w3-container w3-center w3-content" style="max-width:3000px">
        <mat-icon class="pos">code</mat-icon>
        <h2 class="pos">Links</h2>
        <p class="pos" *ngIf="personalDetails.linkedinUrl"><a [href]="personalDetails.linkedinUrl" target="_blank" rel="noopener">LinkedIn</a></p>
        <p class="pos" *ngIf="personalDetails.githubUrl"><a [href]="personalDetails.githubUrl" target="_blank" rel="noopener">GitHub</a></p>
        <p class="pos" *ngIf="personalDetails.portfolioUrl"><a [href]="personalDetails.portfolioUrl" target="_blank" rel="noopener">Portfolio</a></p>
      </section>
    </div>
  </div>
</ng-container>
