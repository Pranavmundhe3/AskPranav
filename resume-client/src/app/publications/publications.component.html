<p class="center" *ngIf="error">Could not load publications from the backend.</p>

<div class="center fade-in-up" *ngFor="let pub of publications; let i = index" [style.animation-delay.ms]="i * 150">
  <div class="card">
    <section class="w3-container w3-center w3-content" style="max-width:3000px">
      <mat-icon class="pos">menu_book</mat-icon>
      <h2 class="pos">{{ pub.title }}</h2>
      <h4 class="pos">{{ pub.venue }}<span *ngIf="pub.publishedOn"> - {{ pub.publishedOn }}</span></h4>
      <p class="pos">{{ pub.description }}</p>
      <p class="pos" *ngIf="pub.technologies"><strong>Technologies:</strong> {{ pub.technologies }}</p>
      <p class="pos" *ngIf="pub.url"><a [href]="pub.url" target="_blank" rel="noopener">Read publication</a></p>
    </section>
  </div>
</div>
