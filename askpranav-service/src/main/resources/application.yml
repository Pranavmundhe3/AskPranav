server:
  port: 5000
  # Set to "native" when running behind a reverse proxy so the rate limiter sees each visitor's real IP
  # (Tomcat then trusts X-Forwarded-For only from private-range proxies). Leave "none" when exposed directly,
  # otherwise a client could spoof the header to dodge the limit.
  forward-headers-strategy: ${ASKPRANAV_FORWARD_HEADERS:none}

spring:
  application:
    name: askpranav-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:askpranav}
    username: ${DB_USERNAME:askpranav}
    password: ${DB_PASSWORD}

  mail:
    # Contact form delivery. Defaults suit Gmail (use an App Password, not the account password).
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        # Native Google GenAI client with a plain Gemini API key (Google AI Studio) - no GCP project.
        # It round-trips Gemini 3's thought_signature on tool calls, which generic compatibility clients drop.
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${ASKPRANAV_GEMINI_MODEL:gemini-3.6-flash}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: ${ASKPRANAV_GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: ${EMBEDDING_DIMENSIONS:768}

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # Must equal the embedding model's output size (same env var feeds both). pgvector's HNSW index
        # caps at 2000 dims, so 3072-dim models need a reduced `dimensions` here.
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        initialize-schema: true

    mcp:
      server:
        name: askpranav-mcp-server
        version: 0.0.1
        type: SYNC

# --- AskPranav application config ---
askpranav:
  ingestion:
    # always: re-embed every startup (dev). if-empty: only embed if the vector store looks empty (default).
    mode: ${ASKPRANAV_INGESTION_MODE:if-empty}
  knowledge:
    # Comma-separated GitHub sources whose README.md files are ingested. Each entry may be a repo
    # ("Pranavmundhe3/AskPranav" or its URL) or an account URL ("https://github.com/Pranavmundhe3"),
    # which pulls every public, non-fork repository of that account.
    github-repos: ${ASKPRANAV_GITHUB_REPOS:}
  rate-limit:
    # Per client IP, sliding window, applied to POST /ask/question. Every question costs several Gemini calls.
    max-requests: ${ASKPRANAV_RATE_LIMIT_MAX:2}
    window-seconds: ${ASKPRANAV_RATE_LIMIT_WINDOW_SECONDS:300}
  security:
    # Login for the write endpoints (POST .../save-*). There is deliberately no default password: when
    # ASKPRANAV_ADMIN_PASSWORD is unset, no admin account exists and every write is rejected.
    admin-username: ${ASKPRANAV_ADMIN_USER:admin}
    admin-password: ${ASKPRANAV_ADMIN_PASSWORD:}
  contact:
    # Where contact-form messages are delivered. No default: this repository is public.
    to: ${ASKPRANAV_CONTACT_TO:}
    # Sender address; most SMTP providers require it to be the authenticated account.
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    rate-limit:
      max-requests: ${ASKPRANAV_CONTACT_RATE_LIMIT_MAX:3}
      window-seconds: ${ASKPRANAV_CONTACT_RATE_LIMIT_WINDOW_SECONDS:600}
