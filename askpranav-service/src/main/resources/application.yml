server:
  port: 5000

spring:
  application:
    name: askpranav-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:askpranav}
    username: ${DB_USERNAME:askpranav}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      # Which auto-configured starter backs each capability. Without this, every starter on the classpath
      # (OpenAI, Anthropic, Google GenAI) tries to build its own model bean at startup, and any with an
      # empty key fails the whole app - and PgVectorStore would see several EmbeddingModel beans.
      # Chat follows askpranav.ai.provider, so its values are the selector names: openai | anthropic |
      # google-genai. Anthropic has no embedding model, so embeddings are selected separately.
      embedding: ${ASKPRANAV_EMBEDDING_STARTER:google-genai}
      chat: ${ASKPRANAV_AI_PROVIDER:anthropic}
      # The OpenAI starter also auto-creates image/audio/moderation models, and each one demands an API key
      # at startup even though this app never uses them. "none" matches no starter, so they're not built.
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${ASKPRANAV_OPENAI_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${ASKPRANAV_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${EMBEDDING_DIMENSIONS:768}

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          # Set explicitly rather than relying on the starter's baked-in default, which can lag behind
          # newly released models. Swap via env var - that's the point of the model-agnostic layer.
          model: ${ASKPRANAV_ANTHROPIC_MODEL:claude-sonnet-5}

    google:
      genai:
        # Native Google GenAI client with a plain Gemini API key (Google AI Studio) - no GCP project.
        # Unlike the OpenAI-compatibility endpoint, it round-trips Gemini 3's thought_signature on tool calls.
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${ASKPRANAV_GEMINI_MODEL:gemini-3.6-flash}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: ${ASKPRANAV_GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: ${EMBEDDING_DIMENSIONS:768}

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # Must equal the embedding model's output size (same env var feeds both). pgvector's HNSW index
        # caps at 2000 dims, so 3072-dim models need a reduced `dimensions` here.
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        initialize-schema: true

    mcp:
      server:
        name: askpranav-mcp-server
        version: 0.0.1
        type: SYNC

# --- AskPranav application config ---
askpranav:
  ai:
    # Which Spring AI ChatModel bean to route to: openai | anthropic | google-genai
    provider: ${ASKPRANAV_AI_PROVIDER:anthropic}
  ingestion:
    # always: re-embed every startup (dev). if-empty: only embed if the vector store looks empty (default).
    mode: ${ASKPRANAV_INGESTION_MODE:if-empty}
  knowledge:
    # owner/repo slugs whose README.md should be ingested into the vector store, e.g. "Pranavmundhe3/AskPranav"
    github-repos: ${ASKPRANAV_GITHUB_REPOS:}
